name: Update TCGPlayer market prices

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TCGPlayer prices and update card data
        run: node update-tcg-prices.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onepiece_cards.js gundam_cards.js sw.js
          if git diff --cached --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "Update TCGPlayer market prices"
            git push
          fi
