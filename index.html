<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCG Vault</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">TCG Vault</div>
  <div class="game-switch" id="game-switch">
    <button class="game-btn active" data-game="onepiece">One Piece</button>
    <button class="game-btn" data-game="gundam">Gundam</button>
  </div>
</header>

<main id="view-browse" class="view active">
  <div class="filter-bar">
    <input id="search-input" type="search" placeholder="Search cards by name or text..." autocomplete="off">
    <button id="filter-toggle" class="icon-btn" aria-label="Filters">Filters</button>
  </div>
  <div id="filter-panel" class="filter-panel hidden">
    <div class="filter-row">
      <label>Set
        <select id="filter-set"><option value="">All sets</option></select>
      </label>
      <label>Color
        <select id="filter-color"><option value="">All colors</option></select>
      </label>
    </div>
    <div class="filter-row">
      <label>Type
        <select id="filter-type"><option value="">All types</option></select>
      </label>
      <label>Rarity
        <select id="filter-rarity"><option value="">All rarities</option></select>
      </label>
    </div>
    <div class="filter-row">
      <label>Sort
        <select id="filter-sort">
          <option value="set">Set order</option>
          <option value="name">Name (A-Z)</option>
          <option value="cost">Cost (low-high)</option>
        </select>
      </label>
      <button id="filter-clear" class="text-btn">Clear filters</button>
    </div>
  </div>
  <div id="result-count" class="result-count"></div>
  <div id="card-grid" class="card-grid"></div>
</main>

<main id="view-deck" class="view">
  <div class="deck-toolbar">
    <select id="deck-select"></select>
    <button id="deck-new" class="text-btn">+ New deck</button>
    <button id="deck-rename" class="text-btn">Rename</button>
    <button id="deck-delete" class="text-btn danger">Delete</button>
  </div>
  <div id="deck-legality" class="legality"></div>
  <div id="deck-stats" class="deck-stats"></div>
  <div id="deck-leader-slot" class="deck-leader-slot"></div>
  <div class="deck-body">
    <div class="deck-list-panel">
      <h3>Deck (<span id="deck-count">0</span>)</h3>
      <div id="deck-list" class="deck-list"></div>
      <div id="deck-don-section" class="deck-resource-section hidden">
        <h3>DON!! Deck (<span id="don-count">0</span>/10)</h3>
        <div id="don-list" class="deck-list"></div>
      </div>
      <div id="deck-resource-section" class="deck-resource-section hidden">
        <h3>Resource Deck (<span id="resource-count">0</span>/10)</h3>
        <div id="resource-list" class="deck-list"></div>
      </div>
      <div class="deck-actions">
        <button id="deck-export" class="text-btn">Export list</button>
        <button id="deck-import" class="text-btn">Import list</button>
        <button id="deck-clear" class="text-btn danger">Clear deck</button>
      </div>
    </div>
    <div class="deck-add-panel">
      <h3>Add cards</h3>
      <div class="deck-add-tools">
        <input id="deck-search" type="search" placeholder="Search cards to add...">
        <button id="deck-color-toggle" class="text-btn hidden">Any color</button>
      </div>
      <div id="deck-add-grid" class="card-grid small"></div>
    </div>
  </div>
</main>

<main id="view-collection" class="view">
  <div class="collection-toolbar">
    <input id="collection-search" type="search" placeholder="Search your trade binder...">
    <select id="collection-deck-filter">
      <option value="">Trade binder (every printing you own)</option>
    </select>
  </div>
  <div id="collection-summary" class="collection-summary"></div>
  <div class="offline-panel">
    <div id="cache-status" class="cache-status">Checking offline image cache...</div>
    <div class="offline-actions">
      <button id="cache-all-btn" class="text-btn">Cache images now</button>
      <button id="cache-clear-btn" class="text-btn danger">Clear cached images</button>
    </div>
  </div>
  <div id="collection-list" class="collection-list"></div>
</main>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="browse">
    <span class="tab-icon">&#128269;</span><span>Cards</span>
  </button>
  <button class="tab-btn" data-tab="deck">
    <span class="tab-icon">&#128209;</span><span>Decks</span>
  </button>
  <button class="tab-btn" data-tab="collection">
    <span class="tab-icon">&#128230;</span><span>Collection</span>
  </button>
</nav>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal" class="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="onepiece_cards.js"></script>
<script src="gundam_cards.js"></script>
<script src="app.js"></script>
</body>
</html>
